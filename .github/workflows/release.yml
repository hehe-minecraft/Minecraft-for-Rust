name: Release

on:
  push:
    branches:
    - main

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Test
      run: cargo test --verbose -- --include-ignored
    - name: Build
      run: cargo build --release
